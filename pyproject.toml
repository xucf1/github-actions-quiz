[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "github-actions-quiz"
version = "1.0.0"
description = "GitHub Actions training quiz backend"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0,<4.0"
]

[tool.setuptools]
py-modules = ["app"]
